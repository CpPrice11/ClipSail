<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LoadSail</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="bar" data-tauri-drag-region>
    <div class="brand" data-tauri-drag-region><img src="icon.svg" width="24" height="24" alt="" draggable="false" data-tauri-drag-region><span data-t="app" data-tauri-drag-region></span><span id="appVersion" class="app-version muted" data-tauri-drag-region hidden></span></div>
    <label id="savedSearchBox" class="url-field" hidden><input id="savedSearch" type="search" autocomplete="off"></label>
    <div class="app-controls">
      <button id="updatesButton" class="icon-button" type="button" aria-haspopup="dialog"><span data-icon="retry"></span></button>
      <div class="caption-buttons">
        <button id="windowMinimize" type="button"><span class="fluent-icon" aria-hidden="true">&#xE921;</span></button>
        <button id="windowMaximize" type="button"><span class="fluent-icon" aria-hidden="true">&#xE922;</span></button>
        <button id="windowClose" type="button"><span class="fluent-icon" aria-hidden="true">&#xE8BB;</span></button>
      </div>
    </div>
  </header>
  <div id="shell" class="shell">
  <div class="nav-rail">
    <button id="navToggle" type="button" aria-controls="tabs" aria-expanded="false"><span class="fluent-icon" aria-hidden="true">&#xE700;</span></button>
    <nav id="tabs" role="tablist" aria-orientation="vertical">
      <button id="savedTab" role="tab" aria-controls="savedPanel" aria-selected="false" tabindex="-1"><span class="fluent-icon" aria-hidden="true">&#xE7AA;</span><span class="nav-label" data-t="savedGallery"></span></button>
      <button id="findTab" role="tab" aria-controls="findPanel" aria-selected="true"><span data-icon="search"></span><span class="nav-label" data-t="find"></span></button>
      <button id="queueTab" role="tab" aria-controls="queuePanel" aria-selected="false" tabindex="-1"><span data-icon="download"></span><span class="nav-label" data-t="downloads"></span><span id="queueCount" class="count" hidden></span></button>
      <button id="settingsTab" role="tab" aria-controls="settingsPanel" aria-selected="false" tabindex="-1"><span class="fluent-icon" aria-hidden="true">&#xE713;</span><span class="nav-label" data-t="settings"></span></button>
    </nav>
  </div>

  <main>
    <section id="findPanel" role="tabpanel" aria-labelledby="findTab">
      <form id="searchForm" class="search">
        <h1 data-t="find"></h1>
        <label for="url" data-t="pageUrl"></label>
        <div class="search-row">
          <div class="url-field"><span data-icon="link"></span><input id="url" type="url" required aria-describedby="searchError" maxlength="8192" placeholder="https://example.com" spellcheck="false"></div>
          <button id="searchButton" class="primary" type="submit"><span data-icon="search"></span><span data-t="search"></span></button>
        </div>
        <label class="collection-option"><input id="scanCollection" type="checkbox"><span data-t="scanCollection"></span></label>
        <div id="playerCaptureControls" class="player-capture" hidden>
          <button id="openPlayerCapture" type="button"><span data-icon="video"></span><span data-t="playerCaptureOpen"></span></button>
          <button id="stopPlayerCapture" type="button" data-t="playerCaptureStop" hidden></button>
          <span id="playerCaptureStatus" class="muted" role="status"></span>
        </div>
        <p id="searchError" class="error" role="alert" hidden></p>
        <button id="openBlockedPage" type="button" data-t="openInBrowser" hidden></button>
      </form>
      <div class="workspace">
        <section class="results" aria-labelledby="resultsTitle">
          <div class="results-toolbar">
            <div class="panel-head">
              <div class="head-title"><h2 id="resultsTitle" data-t="results"></h2><span id="resultCount" class="count" hidden></span></div>
              <label class="select-all" id="allControl" hidden><input id="selectAll" type="checkbox"><span data-t="selectAll"></span></label>
            </div>
            <div id="findFilterBar" class="find-filter-bar" hidden>
              <button id="findMediaType" type="button" popovertarget="filters" aria-haspopup="menu" aria-expanded="false">
                <span id="findMediaTypeIcon" aria-hidden="true"></span><span id="findMediaTypeLabel"></span>
                <span class="fluent-icon" aria-hidden="true">&#xE70D;</span>
              </button>
              <div class="find-sort-controls">
                <button id="findSort" type="button" popovertarget="findSortMenu" aria-haspopup="menu" aria-controls="findSortMenu" aria-expanded="false">
                  <span id="findSortLabel"></span>
                  <span class="fluent-icon" aria-hidden="true">&#xE70D;</span>
                </button>
                <button id="findSortDirection" class="icon-button" type="button" disabled>
                  <span class="fluent-icon" aria-hidden="true">&#xE74B;</span>
                </button>
              </div>
            </div>
          </div>
          <div class="saved-menu" id="filters" popover role="menu" aria-labelledby="findMediaType"></div>
          <div id="findSortMenu" class="saved-menu" popover role="menu" aria-labelledby="findSort"></div>
          <div id="resultsContent" class="results-content">
            <p id="collectionStatus" class="muted" role="status" hidden></p>
            <p id="findSortStatus" class="muted" role="status" hidden></p>
            <div id="resultsStatus" class="empty" role="status"></div>
            <div id="gallery" class="gallery" hidden></div>
          </div>
        </section>
        <aside id="findDetails" class="file-details" hidden></aside>
      </div>
      <footer class="selection">
        <div class="destination" role="group" aria-labelledby="destinationLabel">
          <span data-icon="folder"></span>
          <div><span id="destinationLabel" class="muted" data-t="destination"></span><div id="folderPath" class="path"></div></div>
          <button id="pickFolder" type="button" data-t="change"></button>
        </div>
        <span id="selectionCount" class="muted" role="status"></span>
        <button id="enqueue" class="primary" type="button" disabled><span data-icon="download"></span><span id="enqueueLabel"></span></button>
      </footer>
    </section>
    <section id="savedPanel" role="tabpanel" aria-labelledby="savedTab" hidden>
      <div class="saved-header">
        <div><h1><span class="fluent-icon" aria-hidden="true">&#xE7AA;</span><span data-t="savedGallery"></span></h1><p id="savedCount" class="muted" aria-live="polite"></p></div>
        <div class="saved-commands">
          <button type="button" id="refreshSaved"><span class="fluent-icon" aria-hidden="true">&#xE72C;</span><span data-t="refreshSaved"></span></button>
          <button class="saved-command" id="savedSort" type="button" popovertarget="savedSortMenu" aria-haspopup="menu" aria-expanded="false" hidden>
            <span data-icon="sort" aria-hidden="true"></span>
          </button>
          <div class="saved-menu" id="savedSortMenu" popover role="menu" aria-labelledby="savedSort"></div>
          <button class="saved-command" id="savedFilters" type="button" popovertarget="savedFilterMenu" aria-haspopup="menu" aria-expanded="false" hidden>
            <span class="fluent-icon" aria-hidden="true">&#xE71C;</span>
          </button>
          <div class="saved-menu" id="savedFilterMenu" popover role="menu" aria-labelledby="savedFilters"></div>
          <button class="saved-command" id="savedView" type="button" popovertarget="savedViewMenu" aria-haspopup="menu" aria-expanded="false" hidden>
            <span class="fluent-icon" aria-hidden="true">&#xE80A;</span>
          </button>
          <div class="saved-menu" id="savedViewMenu" popover role="menu" aria-labelledby="savedView"></div>
        </div>
      </div>
      <div id="savedStatus" class="empty" role="status"></div>
      <div class="saved-layout">
        <div id="savedStream" hidden>
          <div id="savedGallery"></div>
          <nav id="savedTimeline" class="saved-timeline" hidden></nav>
        </div>
        <aside id="savedDetails" class="file-details" hidden></aside>
      </div>
    </section>

    <section id="queuePanel" role="tabpanel" aria-labelledby="queueTab" hidden>
      <div class="panel-head queue-head">
        <h1 data-t="downloads"></h1>
        <span id="queueSummary" class="muted"></span>
        <button id="addDirectDownload" class="primary" type="button">
          <span class="fluent-icon" aria-hidden="true">&#xE710;</span><span data-t="addDownload"></span>
        </button>
      </div>
      <div id="queueError" class="error" role="alert" hidden></div>
      <div class="queue-filters">
        <div id="queueCategories" role="group" aria-label="">
          <button data-category="all" data-t="allDownloads" aria-pressed="true"></button>
          <button data-category="unfinished" data-t="unfinishedDownloads" aria-pressed="false"></button>
          <button data-category="completed" data-t="completedDownloads" aria-pressed="false"></button>
        </div>
        <button id="queueMedia" type="button" popovertarget="queueMediaMenu" aria-haspopup="menu" aria-expanded="false">
          <span class="fluent-icon" aria-hidden="true">&#xE71C;</span>
          <span id="queueMediaLabel"></span>
        </button>
        <div class="saved-menu" id="queueMediaMenu" popover role="menu" aria-labelledby="queueMedia">
          <button type="button" role="menuitemradio" data-kind="all" aria-checked="true"><span class="fluent-icon" aria-hidden="true">&#xE7AA;</span><span data-t="savedAll"></span></button>
          <button type="button" role="menuitemradio" data-kind="video" aria-checked="false"><span class="fluent-icon" aria-hidden="true">&#xE714;</span><span data-t="videos"></span></button>
          <button type="button" role="menuitemradio" data-kind="image" aria-checked="false"><span class="fluent-icon" aria-hidden="true">&#xEB9F;</span><span data-t="images"></span></button>
          <button type="button" role="menuitemradio" data-kind="gif" aria-checked="false"><span class="fluent-icon" aria-hidden="true">&#xE8B9;</span><span data-t="gif"></span></button>
          <button type="button" role="menuitemradio" data-kind="audio" aria-checked="false"><span class="fluent-icon" aria-hidden="true">&#xE8D6;</span><span data-t="audioList"></span></button>
          <button type="button" role="menuitemradio" data-kind="asset" aria-checked="false"><span class="fluent-icon" aria-hidden="true">&#xE90F;</span><span data-t="pageAssets"></span></button>
          <button type="button" role="menuitemradio" data-kind="file" aria-checked="false"><span class="fluent-icon" aria-hidden="true">&#xE7C3;</span><span data-t="otherFiles"></span></button>
        </div>
      </div>
      <div class="queue-list">
        <table id="queueTable" aria-labelledby="queueTab">
          <thead><tr>
            <th scope="col"><button data-sort="name"><span data-t="fileName"></span><span data-icon="sort"></span></button></th>
            <th scope="col"><button data-sort="total"><span data-t="size"></span><span data-icon="sort"></span></button></th>
            <th scope="col"><button data-sort="status"><span data-t="downloadStatus"></span><span data-icon="sort"></span></button></th>
            <th scope="col" id="queueSpeed" hidden><button data-sort="speed"><span data-t="speed"></span><span data-icon="sort"></span></button></th>
            <th scope="col" class="queue-action-heading" data-t="queueActions"></th>
          </tr></thead>
          <tbody id="jobs"></tbody>
        </table>
        <div id="queueEmpty" class="queue-empty muted" role="status" hidden></div>
        <footer id="queueLocation" class="queue-location muted" hidden>
          <span data-icon="folder"></span>
          <span id="queuePath"></span>
        </footer>
      </div>
    </section>
    <section id="settingsPanel" role="tabpanel" aria-labelledby="settingsTab" hidden>
      <div class="settings-content">
        <h1 data-t="settings"></h1>
        <section class="settings-group" aria-labelledby="generalSettingsTitle">
          <h2 id="generalSettingsTitle" data-t="generalSettings"></h2>
          <div class="settings-row">
            <label for="language" data-t="language"></label>
            <select id="language"><option value="uk" lang="uk">Українська</option><option value="en" lang="en">English</option><option value="ru" lang="ru">Русский</option></select>
          </div>
          <div class="settings-row" role="group" aria-labelledby="settingsFolderLabel">
            <div><span id="settingsFolderLabel" data-t="destination"></span><p id="settingsFolderPath" class="path"></p></div>
            <button id="settingsPickFolder" type="button" data-t="change" aria-labelledby="settingsPickFolder settingsFolderLabel"></button>
          </div>
        </section>
        <section class="settings-group" aria-labelledby="browserSettingsTitle">
          <h2 id="browserSettingsTitle" data-t="browserConnections"></h2>
          <div class="settings-row">
            <a id="firefoxAddon" href="https://addons.mozilla.org/firefox/addon/clipsail-video/" target="_blank" rel="noopener noreferrer"><span data-t="firefoxAddon"></span><span class="fluent-icon" aria-hidden="true">&#xE8A7;</span></a>
            <button id="connectFirefox" type="button" data-t="connectFirefox"></button>
          </div>
          <div class="settings-row">
            <span>Chrome</span>
            <button id="connectChrome" type="button" data-t="connectChrome"></button>
          </div>
        </section>
      </div>
    </section>
  </main>
  </div>
  <div id="notice" role="status" aria-live="polite" class="notice" hidden></div>
  <dialog id="updatesDialog" aria-labelledby="updatesTitle">
    <h2 id="updatesTitle" data-t="updates"></h2>
    <p id="updateStatus" role="status"></p>
    <form class="dialog-actions" method="dialog">
      <button type="button" id="updateReleases" data-t="releasePage" hidden></button>
      <button type="button" id="installUpdate" class="primary" data-t="updateInstall" hidden></button>
      <button data-t="close" autofocus></button>
    </form>
  </dialog>
  <dialog id="removeDialog" aria-labelledby="removeQuestion"><form method="dialog"><p id="removeQuestion" data-t="confirmRemove"></p><div class="dialog-actions"><button value="cancel" autofocus data-t="cancel"></button><button value="remove" data-t="remove"></button></div></form></dialog>
  <dialog id="directDialog" aria-labelledby="directTitle">
    <form id="directForm">
      <h2 id="directTitle" data-t="addDownload"></h2>
      <label><span data-t="directLink"></span><input id="directUrl" type="url" maxlength="8192" placeholder="https://" required autofocus aria-describedby="directError"></label>
      <dl id="directInfo" class="metadata" aria-live="polite" hidden>
        <div><dt data-t="fileName"></dt><dd id="directName"></dd></div>
        <div><dt data-t="size"></dt><dd id="directSize"></dd></div>
      </dl>
      <div class="save-destination">
        <label><span data-t="destination"></span><input id="directFolder" readonly></label>
        <button id="directPickFolder" type="button" data-t="change"></button>
      </div>
      <p id="directStatus" class="muted" role="status" hidden></p>
      <p id="directError" class="error" role="alert" hidden></p>
      <div class="dialog-actions">
        <button id="directCancel" type="button" data-t="cancel"></button>
        <button id="directSubmit" type="submit" class="primary"></button>
      </div>
    </form>
  </dialog>
  <dialog id="downloadOptions" aria-labelledby="downloadOptionsTitle">
    <form id="downloadOptionsForm">
      <h2 id="downloadOptionsTitle" data-t="downloadQuality"></h2>
      <div id="downloadOptionsList"></div>
      <div class="dialog-actions">
        <button id="cancelDownloadOptions" type="button" data-t="cancel"></button>
        <button type="submit" class="primary" data-t="downloadNow"></button>
      </div>
    </form>
  </dialog>
  <dialog id="browserSave" aria-labelledby="browserSaveTitle">
    <form id="browserSaveForm">
      <h2 id="browserSaveTitle" data-t="saveVideo"></h2>
      <p id="browserSaveSource" class="muted"></p>
      <div id="browserSaveQuality" hidden></div>
      <p id="browserQualityStatus" class="muted" role="status" hidden></p>
      <label><span data-t="fileName"></span><input id="browserSaveName" type="text" maxlength="120" required autofocus></label>
      <div class="save-destination">
        <label><span data-t="destination"></span><input id="browserSaveFolder" readonly></label>
        <button id="browserPickFolder" type="button" data-t="change"></button>
      </div>
      <p id="browserSaveError" class="error" role="alert" hidden></p>
      <div class="dialog-actions">
        <button type="button" id="browserCancel" data-t="cancel"></button>
        <button type="submit" value="later" data-t="downloadLater"></button>
        <button type="submit" value="now" class="primary" data-t="downloadNow"></button>
      </div>
    </form>
  </dialog>
  <dialog id="zoom" aria-labelledby="zoomTitle">
    <header class="preview-header">
      <h2 id="zoomTitle" aria-live="polite"></h2>
      <button id="closeZoom" class="icon-button" type="button" autofocus><span data-icon="close"></span></button>
    </header>
    <div id="zoomContent">
      <div id="zoomMedia"></div>
      <nav id="previewRail" class="preview-rail" hidden>
        <button id="previousPreview" class="icon-button" type="button" aria-keyshortcuts="ArrowLeft"><span data-icon="previous"></span></button>
        <div id="previewStrip" class="preview-strip"></div>
        <button id="nextPreview" class="icon-button" type="button" aria-keyshortcuts="ArrowRight"><span data-icon="next"></span></button>
      </nav>
      <div id="previewToolbar" class="preview-toolbar">
        <div id="zoomActions" class="preview-actions"></div>
        <label id="previewMark"><input id="previewCheck" type="checkbox"><span data-t="selectForDownload"></span></label>
      </div>
      <details id="zoomInformation" class="details-information">
        <summary data-t="fileInformation"></summary>
        <div id="zoomDetails"></div>
      </details>
    </div>
  </dialog>
</body>
</html>
