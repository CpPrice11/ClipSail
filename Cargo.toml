[package]
name = "media-downloader"
version = "0.1.72"
edition = "2024"
default-run = "media-downloader"

[[bin]]
name = "media-downloader-firefox"
path = "src/firefox_host.rs"

[build-dependencies]
tauri-build = { version = "=2.6.0", features = [] }

[dependencies]
tauri = { version = "=2.11.0", features = ["protocol-asset", "tray-icon"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["native-tls", "stream"] }
tokio = { version = "=1.52.2", features = ["fs", "io-util", "sync", "macros", "time", "process"] }
futures-util = "0.3"
html5ever = "0.38"
regex = "1"
quick-xml = "=0.39.3"
encoding_rs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
rfd = "=0.16.0"
base64 = "0.22"
percent-encoding = "2"
dirs = "6"
winreg = "=0.55.0"
webview2-com = "=0.38.2"
windows = { version = "=0.61.3", features = ["Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_UI_Controls", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
tauri-plugin-updater = { version = "=2.12.0", default-features = false, features = ["native-tls"] }

